name: APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar web
        run: |
          mkdir www
          cp index.html config.js manifest.json sw.js icon-192.png icon-512.png www/
      - name: Crear app
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Calistenia Ranking" com.calistenia.ranking --web-dir www
          npx cap add android
          npx cap sync android
      - name: Icono
        run: |
          npm i sharp
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          node -e "const s=require('sharp');(async()=>{for(const [n,z] of [['mdpi',48],['hdpi',72],['xhdpi',96],['xxhdpi',144],['xxxhdpi',192]]){for(const f of ['ic_launcher','ic_launcher_round','ic_launcher_foreground']){await s('icon-512.png').resize(z,z).toFile('android/app/src/main/res/mipmap-'+n+'/'+f+'.png')}}})()"
      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calistenia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
