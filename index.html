.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.rk{font-size:22px;width:36px;text-align:center}
.sub button{font-size:14px;padding:10px 4px}
.nm{font-weight:700;font-size:20px}.mu{color:var(--mu);font-size:15px}
.sc{font-family:Oswald,sans-serif;font-weight:700;color:#ffb347;font-size:26px}
.days{display:flex;gap:4px;margin:8px 0}
.d{flex:1;text-align:center;font-size:14px;padding:7px 0;border-radius:7px;border:1px solid var(--bd);color:var(--mu)}
.d.on{background:linear-gradient(135deg,#ff7a18,#ff3d71);border-color:transparent;color:#fff;font-weight:700}
.ph{display:flex;gap:6px;overflow-x:auto;margin:6px 0}
.ph video{width:130px;height:180px;object-fit:cover;border-radius:12px;background:#000;display:block}
.ph>div{flex:none;text-align:center}
button,select,input{font:inherit}
input,select{padding:11px;border:1px solid var(--bd);border-radius:10px;background:#ffffff14;color:var(--tx);min-width:0;font-size:16px}
.btn{padding:13px 18px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff7a18,#ff3d71);color:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 14px #ff3d7155}
.btn.g{background:linear-gradient(135deg,#12b3c4,#2b6cf0);color:#fff;border:0;box-shadow:0 4px 14px #2b6cf055}
.v{padding:9px 12px;font-size:15px;border:1px solid var(--bd);background:#ffffff14;color:var(--tx);border-radius:10px}
.v.on{border-color:var(--ok);background:var(--ok);color:#fff}.v.on.x{border-color:var(--bad);background:var(--bad)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mu)}
.ent{display:grid;grid-template-columns:58px 1fr 48px 56px 36px;gap:4px;margin:6px 0}.ent select,.ent input{font-size:14px;padding:8px 3px}.ent option,select option{color:#14202b}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}
#lb img{max-width:94%;max-height:90%;border-radius:10px}
details summary{cursor:pointer;color:var(--mu);font-size:15px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"></head><body>
<main>
<h1>💪 Ranking de Calistenia</h1>
<div class="mu" id="wk"></div>
<div class="tabs"><button id="t1" class="on">🏆 Ranking</button><button id="t2">📝 Mi rutina</button></div>
<div id="msg" class="card mu">Cargando…</div>
<div id="lg" class="card" style="display:none"><h2 style="margin-top:0">Entra o crea tu cuenta</h2><input id="us" placeholder="Usuario (letras y números)" autocapitalize="none" autocomplete="username" style="width:100%;margin:6px 0"><input id="pw" type="password" placeholder="Clave (mínimo 6)" autocomplete="current-password" style="width:100%;margin:6px 0"><div class="row"><button class="btn" id="li" type="button">Entrar</button><button class="btn g" id="su" type="button">Crear cuenta</button></div><div id="lm" class="mu" style="margin-top:8px"></div></div>
<div id="v1"></div><div id="v2" style="display:none"></div>
</main><div id="lb"><img alt=""></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var DN=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
var EX=[["Flexiones",1,"r",1],["Fondos",1.5,"r",2],["Dominadas",2.5,"r",3],["Sentadillas",0.5,"r",1],["Pistol squat",2,"r",4],["Muscle-up",6,"r",7],["Plancha",0.1,"s",2],["Parada de manos",0.15,"s",5],["L-sit",0.2,"s",4],["Front lever",0.6,"s",8],["Planche",0.8,"s",9],["Otro",1,"r",3]];
function weekKey(){var d=new Date();d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);var y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return d.getUTCFullYear()+"-S"+String(Math.ceil(((d-y)/864e5+1)/7)).padStart(2,"0")}
var WEEK=weekKey(),db=null,uid=null,assets=null,docs={},votes={},draft={name:"",entries:[],videos:[]},loaded=false,tab=1,rt="g";
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function score(es){return Math.round(es.reduce(function(a,e){return a+EX[e.e][1]*e.n*e.v},0))}
function reps(r){return (r.entries||[]).reduce(function(a,e){return a+(EX[e.e][2]==="r"?e.n*e.v:0)},0)}
function holds(r){return (r.entries||[]).reduce(function(a,e){return a+(EX[e.e][2]==="s"?e.n*e.v:0)},0)}
function lvl(r){var b=null;(r.entries||[]).forEach(function(e){if(!b||EX[e.e][3]>EX[b.e][3])b=e});return b}
function topTxt(r){var e=lvl(r);return e?EX[e.e][0]+" (nivel "+EX[e.e][3]+")":"—"}
function tech(id){var ok=0,bad=0;for(var k in votes){var t=(votes[k]||{}).t||{};if(t[id]===1)ok++;if(t[id]===-1)bad++}return{ok:ok,bad:bad}}
function approved(r){var t=tech(r.uid);return valid(r)&&t.ok>=1&&t.ok>t.bad}
function daysOf(es){var s={};es.forEach(function(e){s[e.d]=1});return s}
function daysHtml(es){var s=daysOf(es);return '<div class="days">'+DN.map(function(n,i){return '<div class="d'+(s[i]?" on":"")+'">'+n+'</div>'}).join("")+'</div>'}
function tally(id){var ok=0,bad=0;for(var k in votes){var m=(votes[k]||{}).m||{};if(m[id]===1)ok++;if(m[id]===-1)bad++}return{ok:ok,bad:bad}}
function valid(r){var t=tally(r.uid);return (r.videos||[]).length>0&&!(t.bad>=3&&t.bad>t.ok)}
function cardHtml(r,i,ranked){
 var t=tally(r.uid),mine=((votes[uid]||{}).m||{})[r.uid],isMe=r.uid===uid,tc=tech(r.uid),mt=((votes[uid]||{}).t||{})[r.uid];
 var h='<div class="card"><div class="row"><div class="rk">'+(ranked?(["🥇","🥈","🥉"][i]||(i+1)):"—")+'</div><div class="sp"><div class="nm">'+esc(r.name||"Atleta")+(isMe?' <span class="tag">tú</span>':"")+'</div><div class="mu">'+(r.videos||[]).length+' video(s) · '+(r.entries||[]).length+' ejercicios</div></div><div class="sc">'+r.score+' pts</div></div><div class="mu" style="margin-top:6px">🔁 '+reps(r)+' reps · ⏱ '+holds(r)+' s · 🧠 '+topTxt(r)+'</div>'+daysHtml(r.entries||[]);
 h+='<div class="ph">'+(r.videos||[]).map(function(u){return '<video src="'+esc(u)+'" controls playsinline preload="metadata"></video>'}).join("")+'</div>';
 h+='<details><summary>Ver rutina</summary>'+(r.entries||[]).slice().sort(function(a,b){return a.d-b.d}).map(function(e){return '<div class="mu">'+DN[e.d]+' · '+esc(EX[e.e][0])+' · '+e.n+' x '+e.v+(EX[e.e][2]==="s"?" s":"")+'</div>'}).join("")+'</details>';
 if(!isMe&&uid)h+='<div class="row" style="margin-top:8px"><button class="v'+(mine===1?" on":"")+'" data-v="1" data-u="'+esc(r.uid)+'">✅ Válida '+t.ok+'</button><button class="v x'+(mine===-1?" on":"")+'" data-v="-1" data-u="'+esc(r.uid)+'">🚩 Sospechosa '+t.bad+'</button></div><div class="row" style="margin-top:6px"><button class="v'+(mt===1?" on":"")+'" data-tv="1" data-u="'+esc(r.uid)+'">🎯 Buena técnica '+tc.ok+'</button><button class="v x'+(mt===-1?" on":"")+'" data-tv="-1" data-u="'+esc(r.uid)+'">⚠️ Mala técnica '+tc.bad+'</button></div>';
 return h+'</div>'}
function renderRank(){
 var all=Object.keys(docs).map(function(k){return docs[k]}).filter(function(r){return r.week===WEEK});
 var inc=rt==="g"?valid:approved,ks={g:function(a,b){return b.score-a.score},r:function(a,b){return reps(b)-reps(a)||holds(b)-holds(a)},c:function(a,b){var x=lvl(a),y=lvl(b);return (y?EX[y.e][3]:0)-(x?EX[x.e][3]:0)||b.score-a.score}};
 var ok=all.filter(inc).sort(ks[rt]),no=all.filter(function(r){return !inc(r)});
 var h='<div class="tabs sub">'+[["g","🏆 General"],["r","🔁 Repeticiones"],["c","🧠 Complejidad"]].map(function(x){return '<button data-rt="'+x[0]+'" class="'+(rt===x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div><div class="mu" style="margin:4px 0 8px">'+({g:"Puntos por dureza del volumen total.",r:"Más repeticiones con técnica aprobada por otros.",c:"El ejercicio más difícil con técnica aprobada."})[rt]+'</div>'+(ok.length?ok.map(function(r,i){return cardHtml(r,i,true)}).join(""):'<div class="card mu">Aún no hay rutinas validadas esta semana. ¡Sube la tuya con video y pide que validen tu técnica!</div>');
 if(no.length)h+='<h2>'+(rt==="g"?"Sin evidencia o en revisión":"Esperando validación de técnica")+'</h2>'+no.map(function(r){return cardHtml(r,0,false)}).join("");
 $("v1").innerHTML=h}
function renderMine(){
 var d=draft,h='<div class="card"><div class="mu">Tu nombre en el ranking</div><input id="nm" style="width:100%;margin:6px 0" maxlength="24" placeholder="Ej: Juan" value="'+esc(d.name)+'">';
 h+='<h2>Días y ejercicios</h2>'+daysHtml(d.entries)+'<div id="es">'+d.entries.map(function(e,i){return '<div class="ent"><select data-i="'+i+'" data-f="d">'+DN.map(function(n,j){return '<option value="'+j+'"'+(j===e.d?" selected":"")+'>'+n+'</option>'}).join("")+'</select><select data-i="'+i+'" data-f="e">'+EX.map(function(x,j){return '<option value="'+j+'"'+(j===e.e?" selected":"")+'>'+x[0]+'</option>'}).join("")+'</select><input type="number" inputmode="numeric" min="1" data-i="'+i+'" data-f="n" value="'+e.n+'"><input type="number" inputmode="numeric" min="1" data-i="'+i+'" data-f="v" value="'+e.v+'"><button class="v" data-del="'+i+'">✕</button></div>'}).join("")+'</div>';
 h+='<div class="mu">Cada fila: día · ejercicio · series · reps (o segundos en isométricos)</div><button class="btn g" id="add" style="margin-top:8px">+ Añadir ejercicio</button>';
 h+='<h2>Evidencia: video de 30 s</h2><div class="mu" style="margin-bottom:6px">Grábate haciendo el ejercicio (máx. 30 segundos, hasta 20 MB, formato MP4).</div><div class="ph">'+d.videos.map(function(u,i){return '<div><video src="'+esc(u)+'" controls playsinline preload="metadata"></video><button class="v" data-dv="'+i+'" style="margin-top:4px">Quitar</button></div>'}).join("")+'</div><button class="btn g" id="vb" type="button">🎥 Subir video</button><input id="fi" type="file" accept="video/*" style="display:none"> <span id="ps" class="mu"></span>';
 h+='<div class="row" style="margin-top:14px"><div class="sc">'+score(d.entries)+' pts</div><div class="sp"></div><button class="btn" id="sv">Publicar mi rutina</button></div><div id="ss" class="mu"></div></div>';
 $("v2").innerHTML=h}
function show(t){tab=t;$("t1").className=t===1?"on":"";$("t2").className=t===2?"on":"";$("v1").style.display=t===1?"":"none";$("v2").style.display=t===2?"":"none";if(t===2&&loaded)renderMine()}
$("t1").onclick=function(){show(1)};$("t2").onclick=function(){show(2)};
$("wk").textContent="Semana "+WEEK+" · gana la rutina más dura con evidencia";
document.addEventListener("click",function(ev){var t=ev.target;
 if(t.dataset.z){$("lb").firstChild.src=t.src;$("lb").style.display="flex";return}
 if(t.id==="lb"||t.parentNode.id==="lb"){$("lb").style.display="none";return}
 if(t.dataset.v){var m=Object.assign({},((votes[uid]||{}).m)||{}),u=t.dataset.u,v=+t.dataset.v;if(m[u]===v)delete m[u];else m[u]=v;db.doc("votes/"+uid).set({m:m,t:((votes[uid]||{}).t)||{}}).catch(function(){$("msg").style.display="";$("msg").textContent="No se pudo registrar tu voto."});return}
 if(t.dataset.rt){rt=t.dataset.rt;renderRank();return}
 if(t.dataset.tv){var tm=Object.assign({},((votes[uid]||{}).t)||{}),mm=((votes[uid]||{}).m)||{},u2=t.dataset.u,v2=+t.dataset.tv;if(tm[u2]===v2)delete tm[u2];else tm[u2]=v2;db.doc("votes/"+uid).set({m:mm,t:tm}).catch(function(){$("msg").style.display="";$("msg").textContent="No se pudo registrar tu voto."});return}
 if(t.id==="vb"){$("fi").click();return}
 if(t.dataset.dv!==undefined){draft.videos.splice(+t.dataset.dv,1);renderMine();return}
 if(t.id==="add"){draft.entries.push({d:0,e:0,n:3,v:10});renderMine();return}
 if(t.dataset.del!==undefined){draft.entries.splice(+t.dataset.del,1);renderMine();return}
 if(t.id==="sv")save()});
document.addEventListener("change",function(ev){var t=ev.target;
 if(t.id==="nm"){draft.name=t.value.trim();try{localStorage.setItem("calname",draft.name)}catch(e){}return}
 if(t.dataset.f){draft.entries[+t.dataset.i][t.dataset.f]=Math.max(0,+t.value||0);renderMine();return}
 if(t.id==="fi"&&t.files[0])upload(t.files[0])});
function shrink(f){return new Promise(function(res,rej){var im=new Image();im.onload=function(){var s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?res(b):rej()},"image/jpeg",0.8)};im.onerror=rej;im.src=URL.createObjectURL(f)})}
function upload(f){var ps=$("ps");if(!assets){ps.textContent="Tu cuenta no tiene permiso para subir videos. Pide acceso de colaborador al dueño.";return}
 if(f.size>20*1024*1024){ps.textContent="Pesa más de 20 MB. Grábalo en 720p o más corto.";return}
 var v=document.createElement("video");v.preload="metadata";v.onloadedmetadata=function(){URL.revokeObjectURL(v.src);
  if(v.duration>31){ps.textContent="El video dura más de 30 segundos.";return}
  ps.textContent="Subiendo…";assets.upload(f).then(function(r){draft.videos.push(r.url);renderMine()}).catch(function(e){ps.textContent="No se pudo subir el video"+(e&&e.code?" ("+e.code+")":"")+"."})};
 v.onerror=function(){ps.textContent="No se pudo leer el video."};v.src=URL.createObjectURL(f)}
function save(){var ss=$("ss");if(!db){return}
 if(!draft.name){ss.textContent="Escribe tu nombre primero.";return}
 if(!draft.entries.length){ss.textContent="Añade al menos un ejercicio.";return}
 db.doc("routines/"+uid).set({uid:uid,name:draft.name,week:WEEK,entries:draft.entries,videos:draft.videos,score:score(draft.entries),updated:Date.now()}).then(function(){ss.textContent="¡Publicada! Mira el ranking.";show(1)}).catch(function(){ss.textContent="No se pudo guardar. Intenta de nuevo."})}
var SUPABASE_URL=window.CAL_URL||"PEGA_AQUI_TU_URL",SUPABASE_KEY=window.CAL_KEY||"PEGA_AQUI_TU_CLAVE_ANON",sb=null;
function chk(r){if(r.error)throw r.error}
function mkDb(){return{doc:function(p){var a=p.split("/");return{set:function(o){return sb.from(a[0]).upsert({uid:a[1],data:o}).then(chk)}}},collection:function(n){return{onSnapshot:function(ok,er){function load(){sb.from(n).select("uid,data").then(function(r){if(r.error){if(er)er(r.error);return}ok({docs:r.data.map(function(x){return{id:x.uid,data:function(){return x.data}}})})})}load();var ch=sb.channel("c-"+n).on("postgres_changes",{event:"*",schema:"public",table:n},load).subscribe();return function(){sb.removeChannel(ch)}}}}}}
function mkAssets(){return{upload:function(f){var ex=f.type==="video/webm"?"webm":"mp4",p=uid+"/"+Date.now()+"."+ex;return sb.storage.from("videos").upload(p,f,{contentType:f.type||"video/mp4"}).then(function(r){if(r.error)throw r.error;return{url:sb.storage.from("videos").getPublicUrl(p).data.publicUrl}})}}}
function boot(u){
 uid=u.id;db=mkDb();assets=mkAssets();$("lg").style.display="none";$("msg").style.display="";$("msg").textContent="Cargando…";
 try{draft.name=localStorage.getItem("calname")||""}catch(e){}
 if(!draft.name)draft.name=(u.email||"").split("@")[0];
 var to=setTimeout(function(){if(!loaded)$("msg").textContent="No se pudo conectar. Revisa tu internet."},10000);
 db.collection("routines").onSnapshot(function(s){docs={};s.docs.forEach(function(d){docs[d.id]=d.data()});
  if(!loaded){var m=docs[uid];if(m&&m.week===WEEK){draft={name:m.name||draft.name,entries:m.entries||[],videos:m.videos||[]}}}
  loaded=true;clearTimeout(to);$("msg").style.display="none";renderRank();if(tab===2&&!$("v2").dataset.o){$("v2").dataset.o=1;renderMine()}},function(){$("msg").style.display="";$("msg").textContent="Error al leer los datos."});
 db.collection("votes").onSnapshot(function(s){votes={};s.docs.forEach(function(d){votes[d.id]=d.data()});if(loaded)renderRank()})}
function auth(reg){var us=$("us").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,""),pw=$("pw").value,lm=$("lm");
 if(us.length<3||pw.length<6){lm.textContent="Usuario de 3 o más letras o números y clave de 6 o más caracteres.";return}
 lm.textContent="Un momento…";var em=us+"@calistenia-app.com";
 (reg?sb.auth.signUp({email:em,password:pw}):sb.auth.signInWithPassword({email:em,password:pw})).then(function(r){
  if(r.error){lm.textContent=reg?"No se pudo crear la cuenta (quizá ese usuario ya existe).":"Usuario o clave incorrectos.";return}
  if(!r.data.session){lm.textContent="Cuenta creada, pero falta desactivar Confirm email en Supabase.";return}
  boot(r.data.user)})}
function init(){
 $("li").onclick=function(){auth(false)};$("su").onclick=function(){auth(true)};
 if(SUPABASE_URL.indexOf("PEGA")===0||!window.supabase){$("msg").textContent="Falta pegar tu URL y tu clave de Supabase dentro del archivo (ver instrucciones).";return}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 sb.auth.getSession().then(function(r){var ss=r.data&&r.data.session;if(ss)boot(ss.user);else{$("msg").style.display="none";$("lg").style.display="block"}})}
init();
</script></body></html>
